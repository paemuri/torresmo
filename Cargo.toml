[package]
name = "torresmo"
version = "1.0.8"
edition = "2024"
rust-version = "1.89"
description = "Dead-simple and minimal TUI client for the Transmission daemon"
license = "Unlicense"
repository = "https://git.sr.ht/~paemuri/torresmo"
homepage = "https://sr.ht/~paemuri/torresmo"
readme = "README.md"
keywords = ["transmission", "torrent", "tui", "bittorrent"]
categories = ["command-line-utilities"]

[dependencies]
jiff = "0.2.37"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
rustyline = { version = "18.0.1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[profile.release]
lto = true
strip = true
